name: Sync Alina's lists
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 sync_lists.py
      - run: |
          if [ -n "$(git status --porcelain lists.json)" ]; then
            git config user.name "list-sync"; git config user.email "actions@users.noreply.github.com"
            git add lists.json && git commit -m "Sync lists" && git push
          fi
