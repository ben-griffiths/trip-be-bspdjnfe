const mealMatch=(p,meal)=>Array.isArray(p.meals)?p.meals.includes(meal):(meal==="breakfast"?/\bbreakfast\b/.test(catTxt(p)):KW[meal].test(catTxt(p)));
const verifiedBreakfast=p=>(Array.isArray(p.meals)&&p.meals.includes("breakfast"))||/\bbreakfast restaurant\b/.test(catTxt(p));
function openAt(p,date,t){const h=p.det&&p.det.hours;if(!h||!(date in h))return null;const [H,Mi]=t.split(":").map(Number);const m=H*60+Mi;
 const prev=new Date(date+"T12:00:00Z");prev.setUTCDate(prev.getUTCDate()-1);const pd=prev.toISOString().slice(0,10);
 if(h[date].some(([o,c])=>m>=o&&m<c))return true;if(h[pd]&&h[pd].some(([o,c])=>c>1440&&m+1440<c))return true;return false;}
const fmt=m=>{m%=1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");};
function hoursOn(p,date){const h=p.det&&p.det.hours;if(!h||!(date in h))return "Hours unknown";if(!h[date].length)return "Closed";return h[date].map(([o,c])=>fmt(o)+"–"+fmt(c)).join(", ");}
function imgStyle(p,size){if(p.img&&p.img.src)return {cls:"",st:"background-image:url('"+p.img.src+"')"};
 const z=17,n=2**z,x=(p.lng+180)/360*n,lr=p.lat*Math.PI/180,y=(1-Math.log(Math.tan(lr)+1/Math.cos(lr))/Math.PI)/2*n;const tx=Math.floor(x),ty=Math.floor(y);
 return {cls:"map",st:"background-image:url('https://tile.openstreetmap.org/"+z+"/"+tx+"/"+ty+".png');background-size:256px 256px;background-position:calc(50% - "+((x-tx)*256-128).toFixed(0)+"px) calc(50% - "+((y-ty)*256-128).toFixed(0)+"px)"};}
function rank(slot,date,ref){const all=places(slot.city);
 const sc=p=>{const o=openAt(p,date,slot.t),match=mealMatch(p,slot.meal);return (match?0:2)+(o===false?3:o===null?0.5:0)+walkMin(hav(ref,[p.lat,p.lng]))/60-(p.must?1.25:p.foodPick?0.35:0);};
 return all.map(p=>({p,s:sc(p),o:openAt(p,date,slot.t),m:mealMatch(p,slot.meal)})).sort((a,b)=>a.s-b.s);}
function card(p,date,t,ref){const o=date?openAt(p,date,t):null;const im=imgStyle(p);const r=p.det&&p.det.rating;
 return '<div class="pc'+(p.must?' must':'')+(o===false?' dim':'')+'" data-id="'+p.cid+'" data-date="'+(date||"")+'">'+(p.must?'<span class="mustbadge">Must go</span>':p.foodPick?'<span class="mustbadge">Guide pick</span>':'')+'<button class="heart" data-h="'+p.cid+'">'+(ticks[p.cid]?"❤️":"♡")+'</button><div class="im '+im.cls+'" style="'+im.st+'"></div><div class="bx"><div class="n">'+esc(p.name)+'</div><div class="c">'+esc(cats(p)[0]||"")+'</div><div class="r">'+(r?'<span>⭐'+r+'</span>':'')+'<span>'+walkTxt(hav(ME||ref||HOTEL[p.city].c,[p.lat,p.lng])).replace("🚶 ","🚶")+'</span>'+(date?(o===true?'<span class="open">Open</span>':o===false?'<span class="closed">Closed</span>':''):'')+'</div>'+(p.sources?'<div class="src">'+esc(sourceNames(p))+'</div>':'')+(verifiedBreakfast(p)?'<div class="breakfasthint">✓ Breakfast verified</div>':'')+(isFood(p)?'<div class="foodhint">Menu · food photos</div>':'')+'</div></div>';}
function slotHTML(slot,date,ref){const ranked=rank(slot,date,ref);const good=ranked.filter(x=>x.m&&x.o!==false);const list=(good.length?good:ranked).slice(0,8);
 const note=!ranked.length?"No "+slot.city+" recommendations yet":slot.meal==="breakfast"&&good.length?good.length+" verified breakfast option"+(good.length>1?"s":"")+" · open at "+slot.t:good.length?good.length+" good match"+(good.length>1?"es":"")+" · guide picks first":"No clear "+slot.meal+" match · closest options";
 const route=slot.route?'<a class="routepick" target="_blank" rel="noreferrer" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(slot.route.q)+'"><b>Suggested route · '+esc(slot.route.title)+'</b><span>'+esc(slot.route.detail)+'</span><em>Open starting point in Maps ↗</em></a>':'';

function trCard(t){const alts=t.alts?'<details><summary>Other departures</summary><table><tr><th>Dep</th><th>Plat</th><th>Arr</th><th>Plat</th><th></th></tr>'+t.alts.map((a,i)=>'<tr'+(i===t.rec?' class="rec"':'')+'><td>'+a[0]+'</td><td>'+a[1]+'</td><td>'+a[2]+'</td><td>'+a[3]+'</td><td>'+a[4]+(i===t.rec?' ✓':'')+'</td></tr>').join("")+'</table></details>':"";
 return '<div class="card tr"><div class="tt">'+(t.from?t.from+' → '+t.to:t.num)+'</div><div class="row"><span class="big">'+t.dep+'</span><span class="arrow"><span>'+t.dur+'</span></span><span class="big">'+t.arr+'</span></div><div class="pl"><b>'+t.dp+'</b><b>'+t.ap+'</b></div><div class="meta">'+(t.from?t.num+' · ':'')+(t.price||"")+(t.note?'<br>⚠️ '+t.note:'')+'</div>'+alts+'</div>';}

 d.ev.forEach(e=>{const [tm,k,x,note]=e;let body;
  if(k==="res")body=resHTML(x,d.date);else if(k==="meal"||k==="free")body=slotHTML(x,d.date,HOTEL[x.city].c);

function openSheet(id,date){const p=byId(id);if(!p)return;const im=imgStyle(p);const days=DAYS.filter(d=>d.city===p.city||d.ev.some(e=>e[2]&&e[2].city===p.city));
