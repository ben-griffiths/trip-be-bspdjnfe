 return '<div class="pc"><input type="checkbox" class="tick" data-id="'+esc(pid(p))+'" '+(ticks[pid(p)]?"checked":"")+'><div class="b"><div class="n">'+esc(p.name)+'</div>'+(p.note?'<div class="m">📝 '+esc(p.note)+'</div>':'')+'<div class="small">'+esc(p.addr)+'</div><div class="acts"><span class="dist">'+d+'</span><a target="_blank" href="https://maps.google.com/?cid='+p.cid+'">📍 Open in Maps</a><a target="_blank" href="https://www.google.com/maps/dir/?api=1&travelmode=walking&destination='+p.lat+','+p.lng+'">🧭 Walk there</a></div></div></div>';}
function trCard(t){const alts=t.alts?'<details><summary>Other departures</summary><table><tr><th>Dep</th><th>Plat</th><th>Arr</th><th>Plat</th><th></th></tr>'+t.alts.map((a,i)=>'<tr'+(i===t.rec?' class="rec"':'')+'><td>'+a[0]+'</td><td>'+a[1]+'</td><td>'+a[2]+'</td><td>'+a[3]+'</td><td>'+a[4]+(i===t.rec?' ✓':'')+'</td></tr>').join("")+'</table></details>':"";
 return '<div class="card tr"><div class="tt">'+(t.from?t.from+' → '+t.to:t.num)+'</div><div class="row"><span class="big">'+t.dep+'</span><span class="arrow"><span>'+t.dur+'</span></span><span class="big">'+t.arr+'</span></div><div class="pl"><span><b>'+t.dp+'</b></span><span><b>'+t.ap+'</b></span></div><div class="meta">'+(t.from?t.num+' · ':'')+(t.price||"")+'</div>'+(t.note?'<div class="meta">⚠️ '+t.note+'</div>':'')+alts+'</div>';}
function freeCard(f){const P=places(f.city).sort((a,b)=>hav(f.at,[a.lat,a.lng])-hav(f.at,[b.lat,b.lng]));const top=P.slice(0,4),rest=P.slice(4);
 return '<div class="card"><div class="tt">'+f.t+'</div><div class="src">From Alina\'s '+f.city+' list · closest first</div><div class="near">'+(top.map(p=>pcard(p,f.at)).join("")||'<div class="small">Nothing on the list yet.</div>')+'</div>'+(rest.length?'<details><summary>'+rest.length+' more from the list</summary><div class="near">'+rest.map(p=>pcard(p,f.at)).join("")+'</div></details>':'')+'</div>';}
const ICON={flight:"✈️",train:"🚆",tram:"🚋",bag:"🧳",hotel:"🔑",free:"✨"};
function dayHTML(d){const H=HOTEL[d.city];let h='<h2>'+d.title+'</h2><div class="card stay"><span class="ic">🏨</span><div><b>Tonight: '+(d.label==="Mon 16"?"home":H.n)+'</b><div class="chips">'+(d.label==="Mon 16"?'<span class="chip">De Orangerie check-out by '+H.co+'</span>':'<span class="chip">Check-in from '+H.ci+'</span><span class="chip">Check-out by '+H.co+'</span><a class="chip" target="_blank" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(H.q)+'">📍 Map</a>')+'</div></div></div><div class="tl">';
 d.ev.forEach(e=>{const [tm,k,x,note]=e;let body;if(k==="free")body=freeCard(x);else if(typeof x==="object")body=trCard(x);else body=k==="bag"?'<div class="bagnote"><div class="tt">'+x+'</div><div class="ds">'+(note||"")+'</div></div>':'<div class="card"><div class="tt">'+x+'</div><div class="ds">'+(note||"")+'</div></div>';
  h+='<div class="ev k-'+k+'" data-t="'+d.date+'T'+tm+'"><div class="tm">'+tm+'</div><div class="rail"><div class="dot">'+ICON[k]+'</div></div><div class="bd">'+body+'</div></div>';});
 return h+'</div>';}
const S={};
S["Overview"]=()=>'<h2>Trip at a glance</h2><div class="card"><table><tr><th>Night</th><th>Hotel</th><th>In / out</th></tr><tr><td>Fri 13</td><td>NH Brussels Carrefour de l\'Europe</td><td>15:00 / 12:00</td></tr><tr><td>Sat 14</td><td>Hotel Harmony, Ghent</td><td>15:00 / 11:00</td></tr><tr><td>Sun 15</td><td>Hotel De Orangerie, Bruges</td><td>15:00 / 11:00</td></tr></table><div class="small" style="margin-top:6px">✈️ SN2094 LHR 11:05 → BRU 13:15 (Fri) · SN2103 BRU 21:10 → LHR 21:20 (Mon)</div></div>'+
 '<div class="warn">⚠️ <b>Basic fare:</b> one personal item each (max 40×30×15 cm). Add a cabin bag online before check-in, which opens ~11:05 Thu 12 Nov.</div>'+
 '<h3>Tickets</h3><div class="card small">🚆 Trains: buy in the SNCB app (no tapping a card on trains). Prices are Trainline "from" estimates.<br>🚋 Trams/buses: tap a contactless card on the white reader, once per person, €3 for 60 min.<br>⏱️ Times are the real timetable pulled 10 Nov; recheck platforms on the boards.</div>'+
 '<h3>Places</h3><div class="card small">All restaurants and things to do come from Alina\'s Google Maps lists (<a target="_blank" href="'+LIST_LINKS.Brussels+'">Brussels</a>, <a target="_blank" href="'+LIST_LINKS.Ghent+'">Ghent</a>, <a target="_blank" href="'+LIST_LINKS.Bruges+'">Bruges</a>). Add a place to a list and it shows up here within about an hour.<br><span id="upd"></span></div>';
DAYS.forEach(d=>S[d.label]=()=>dayHTML(d));
S["❤️ Alina's lists"]=()=>'<h2>Alina\'s lists</h2><div class="filters" id="fc"></div><div id="flist" class="list"></div>';
S["🗺️ Map"]=()=>'<h2>Map</h2><p class="sub">Blue = hotels, orange = Alina\'s places, green = ticked.</p><div id="map"></div>';
S["✓ My picks"]=()=>'<h2>My picks</h2><p class="sub">Places you\'ve ticked (saved on this device).</p><div id="picks" class="list"></div>';
const nav=document.getElementById("nav"),main=document.getElementById("main");
Object.keys(S).forEach(k=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>show(k);nav.appendChild(b);const s=document.createElement("section");s.dataset.k=k;main.appendChild(s);});
let cur="Overview",fC="Brussels";
function show(k,keep){cur=k;[...nav.children].forEach(b=>b.classList.toggle("on",b.textContent===k));[...main.children].forEach(s=>{const on=s.dataset.k===k;s.classList.toggle("on",on);if(on)s.innerHTML=S[k]();});
 if(k==="❤️ Alina's lists")lists();if(k==="✓ My picks")picks();if(k==="🗺️ Map")mapInit();if(k==="Overview")upd();bind();markNow();history.replaceState(null,"","#"+encodeURIComponent(k));if(!keep)window.scrollTo(0,0);}
function upd(){const e=document.getElementById("upd");if(e)e.textContent="Lists last synced: "+new Date(LISTS.updated).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"});}
function lists(){const fc=document.getElementById("fc");fc.innerHTML=["Brussels","Ghent","Bruges","All"].map(v=>'<button data-v="'+v+'" class="'+(fC===v?"on":"")+'">'+v+'</button>').join("")+'<button id="near">📍 Near me</button>';
 fc.onclick=e=>{if(e.target.dataset.v){fC=e.target.dataset.v;lists();}};document.getElementById("near").onclick=()=>locate(lists);
 let P=fC==="All"?allPlaces():places(fC);const ref=p=>ME||HOTEL[p.city].c;P.sort((a,b)=>hav(ref(a),[a.lat,a.lng])-hav(ref(b),[b.lat,b.lng]));
 document.getElementById("flist").innerHTML=(fC!=="All"?'<p class="sub">'+P.length+' places · <a target="_blank" href="'+LIST_LINKS[fC]+'">open the list in Google Maps</a></p>':'')+P.map(p=>'<div class="card">'+pcard(p)+'</div>').join("");bind();}
function picks(){const P=allPlaces().filter(p=>ticks[pid(p)]);document.getElementById("picks").innerHTML=P.length?P.map(p=>'<div class="card">'+pcard(p)+'<div class="small">'+p.city+'</div></div>').join(""):'<p class="sub">Nothing ticked yet.</p>';bind();}
function bind(){main.querySelectorAll(".tick").forEach(cb=>{cb.onchange=()=>{const id=cb.dataset.id;if(cb.checked)ticks[id]=1;else delete ticks[id];localStorage.setItem(KEY,JSON.stringify(ticks));main.querySelectorAll(".tick").forEach(o=>{if(o.dataset.id===id)o.checked=cb.checked;});};});}
function locate(cb){if(!navigator.geolocation)return alert("Location not available");navigator.geolocation.getCurrentPosition(p=>{ME=[p.coords.latitude,p.coords.longitude];cb();},()=>alert("Couldn't get your location"),{enableHighAccuracy:true,timeout:10000});}
function mapInit(){if(typeof L==="undefined"){document.getElementById("map").innerHTML='<p class="sub" style="padding:12px">Map didn\'t load.</p>';return;}
 const m=L.map("map");L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{attribution:"© OpenStreetMap contributors © CARTO",maxZoom:19}).addTo(m);const pts=[];
 allPlaces().forEach(p=>{const c=[p.lat,p.lng];L.circleMarker(c,{radius:7,color:"#fff",weight:2,fillColor:ticks[pid(p)]?"#1a9e5c":"#ef7d22",fillOpacity:1}).addTo(m).bindPopup("<b>"+esc(p.name)+"</b><br>"+(p.note?esc(p.note)+"<br>":"")+'<a target="_blank" href="https://maps.google.com/?cid='+p.cid+'">Open in Google Maps</a>');pts.push(c);});
 Object.values(HOTEL).forEach(h=>{L.circleMarker(h.c,{radius:10,color:"#fff",weight:3,fillColor:"#2d6cdf",fillOpacity:1}).addTo(m).bindPopup("🏨 <b>"+h.n+"</b>");pts.push(h.c);});
 if(ME)L.circleMarker(ME,{radius:8,color:"#fff",weight:3,fillColor:"#e53935",fillOpacity:1}).addTo(m).bindPopup("You are here");
 m.fitBounds(pts,{padding:[30,30]});}
function bxNow(){return new Date().toLocaleString("sv-SE",{timeZone:"Europe/Brussels"}).replace(" ","T").slice(0,16);}
function markNow(){const now=bxNow();const evs=[...main.querySelectorAll(".ev")];let set=false;evs.forEach((e,i)=>{e.classList.remove("now","past");const nx=evs[i+1];if(nx&&nx.dataset.t<=now)e.classList.add("past");else if(!set&&e.dataset.t.slice(0,10)===now.slice(0,10)&&(e.dataset.t<=now||!nx)){e.classList.add("now");set=true;}});}
const today=DAYS.find(d=>d.date===bxNow().slice(0,10));const fab=document.getElementById("fab");
if(today){fab.style.display="block";fab.onclick=()=>{show(today.label);setTimeout(()=>{const n=main.querySelector(".ev.now")||main.querySelector(".ev:not(.past)");if(n)n.scrollIntoView({behavior:"smooth",block:"center"});},50);};}
setInterval(markNow,60000);
const h=decodeURIComponent(location.hash.slice(1));show(S[h]?h:(today?today.label:"Overview"));
fetch(LIST_URL+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.lists&&new Date(j.updated)>=new Date(LISTS.updated)){LISTS=j;show(cur,true);}}).catch(()=>{});
</script></body></html>
