 const note=!R.length?"Nothing on Alina's "+slot.city+" list yet":good.length?good.length+" good match"+(good.length>1?"es":"")+" · best first":"No clear "+slot.meal+" spot on the list · closest options";
 return '<div class="card slot"><div class="hd"><span class="tt">'+mealLabel[slot.meal]+' '+slot.label+'</span><small>'+note+'</small></div><div class="car">'+list.map(x=>card(x.p,date,slot.t,ref)).join("")+'<a class="pc" style="display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--acc);text-decoration:none;padding:8px" target="_blank" href="'+LIST_LINKS[slot.city]+'">＋ Add to Alina\'s '+slot.city+' list</a></div></div>';}
function trCard(t){const alts=t.alts?'<details><summary>Other departures</summary><table><tr><th>Dep</th><th>Plat</th><th>Arr</th><th>Plat</th><th></th></tr>'+t.alts.map((a,i)=>'<tr'+(i===t.rec?' class="rec"':'')+'><td>'+a[0]+'</td><td>'+a[1]+'</td><td>'+a[2]+'</td><td>'+a[3]+'</td><td>'+a[4]+(i===t.rec?' ✓':'')+'</td></tr>').join("")+'</table></details>':"";
 return '<div class="card tr"><div class="tt">'+(t.from?t.from+' → '+t.to:t.num)+'</div><div class="row"><span class="big">'+t.dep+'</span><span class="arrow"><span>'+t.dur+'</span></span><span class="big">'+t.arr+'</span></div><div class="pl"><b>'+t.dp+'</b><b>'+t.ap+'</b></div><div class="meta">'+(t.from?t.num+' · ':'')+(t.price||"")+(t.note?'<br>⚠️ '+t.note:'')+'</div>'+alts+'</div>';}
function resHTML(x,date){const p=places(x.city).find(q=>q.name.toLowerCase().includes(x.name.toLowerCase()));return '<div class="card" style="border-left:4px solid #ef7d22"><div class="tt">📌 Reserved: '+x.label+' · '+x.time+'</div><div class="ds">'+(p?esc(p.addr)+" · "+walkTxt(hav(HOTEL[x.city].c,[p.lat,p.lng]))+" from the hotel":"")+'</div>'+(p?'<div class="car" style="padding-top:6px">'+card(p,date,x.time,HOTEL[x.city].c)+'</div>':'')+'</div>';}
const ICON={flight:"✈️",train:"🚆",tram:"🚋",bag:"🧳",hotel:"🔑",meal:"🍴",free:"✨",res:"📌"};
function dayHTML(d){const H=HOTEL[d.city];let h='<h2>'+d.title+'</h2><div class="card stay"><span style="font-size:22px">🏨</span><div><b>'+(d.label==="Mon 16"?"Flying home tonight":"Tonight: "+H.n)+'</b><div class="chips">'+(d.label==="Mon 16"?'<span class="chip">De Orangerie check-out by '+H.co+'</span>':'<span class="chip">In from '+H.ci+'</span><span class="chip">Out by '+H.co+'</span><a class="chip" target="_blank" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(H.q)+'">📍 Map</a>')+'</div></div></div><div class="tl">';
 d.ev.forEach(e=>{const [tm,k,x,note]=e;let body;
  if(k==="res")body=resHTML(x,d.date);else if(k==="meal"||k==="free")body=slotHTML(x,d.date,HOTEL[x.city].c);
  else if(typeof x==="object")body=trCard(x);
  else body=k==="bag"?'<div class="bagnote"><div class="tt">🧳 '+x+'</div><div class="ds">'+(note||"")+'</div></div>':'<div class="card"><div class="tt">'+x+'</div>'+(note?'<div class="ds">'+note+'</div>':'')+'</div>';
  h+='<div class="ev k-'+k+'" data-t="'+d.date+'T'+tm+'"><div class="tm">'+tm+'</div><div class="rail"><div class="dot">'+ICON[k]+'</div></div><div class="bd">'+body+'</div></div>';});
 return h+'</div>';}
function openSheet(id,date){const p=byId(id);if(!p)return;const im=imgStyle(p);const days=DAYS.filter(d=>d.city===p.city||d.ev.some(e=>e[2]&&e[2].city===p.city));
 const hrs=days.map(d=>'<div>'+d.label+': '+hoursOn(p,d.date)+'</div>').join("");const r=p.det&&p.det.rating;
 document.getElementById("sheetin").innerHTML='<div class="im '+im.cls+'" style="'+im.st+'"></div><div class="bx"><h4>'+esc(p.name)+'</h4><div class="small">'+esc(cats(p).join(" · "))+(r?' · ⭐ '+r+(p.det.reviews?' ('+p.det.reviews+')':''):'')+(p.det&&p.det.price?' · '+esc(p.det.price):'')+'</div>'+(p.note?'<div class="ds" style="margin-top:6px">📝 Alina: '+esc(p.note)+'</div>':'')+'<div class="small" style="margin-top:6px">'+esc(p.addr)+' · '+walkTxt(hav(ME||HOTEL[p.city].c,[p.lat,p.lng]))+(ME?' from you':' from the hotel')+'</div><div class="hrs"><b>Opening hours on your days</b>'+hrs+'</div><div class="btns"><a class="pri" target="_blank" href="https://www.google.com/maps/dir/?api=1&travelmode=walking&destination='+p.lat+','+p.lng+'">🧭 Walk there</a><a target="_blank" href="https://maps.google.com/?cid='+p.cid+'">📍 Google Maps</a><button data-h="'+p.cid+'">'+(ticks[p.cid]?"❤️ Saved":"♡ Save")+'</button></div>'+(p.img&&p.img.src?'<div class="credit">Photo: Wikimedia Commons · '+esc(p.img.title||"")+'</div>':'<div class="credit">Map © OpenStreetMap contributors</div>')+'</div>';
 document.getElementById("sheet").classList.add("on");}
document.getElementById("sheet").onclick=e=>{if(e.target.id==="sheet")e.currentTarget.classList.remove("on");};
document.addEventListener("click",e=>{const h=e.target.closest("[data-h]");if(h){e.stopPropagation();const id=h.dataset.h;if(ticks[id])delete ticks[id];else ticks[id]=1;localStorage.setItem(KEY,JSON.stringify(ticks));document.querySelectorAll('[data-h="'+id+'"]').forEach(b=>b.textContent=b.classList.contains("heart")?(ticks[id]?"❤️":"♡"):(ticks[id]?"❤️ Saved":"♡ Save"));if(cur==="❤️ Saved")show(cur,true);return;}
 const c=e.target.closest(".pc[data-id]");if(c)openSheet(c.dataset.id,c.dataset.date);},true);
const S={};
S["Overview"]=()=>'<h2>Trip at a glance</h2><div class="card"><table><tr><th>Night</th><th>Hotel</th><th>In / out</th></tr><tr><td>Fri 13</td><td>NH Brussels Carrefour de l\'Europe</td><td>15:00 / 12:00</td></tr><tr><td>Sat 14</td><td>Hotel Harmony, Ghent</td><td>15:00 / 11:00</td></tr><tr><td>Sun 15</td><td>Hotel De Orangerie, Bruges</td><td>15:00 / 11:00</td></tr></table><div class="small" style="margin-top:6px">✈️ SN2094 LHR 11:05 → BRU 13:15 (Fri) · SN2103 BRU 21:10 → LHR 21:20 (Mon)</div></div>'+
 '<div class="warn">⚠️ <b>Basic fare:</b> one personal item each (max 40×30×15 cm). Add a cabin bag online before check-in opens (~11:05 Thu 12 Nov).</div>'+
 '<h3>Getting around</h3><div class="card small">🚆 Trains: SNCB app (no tapping a card on trains). Prices are Trainline "from" estimates.<br>🚋 Trams/buses: tap a contactless card, once per person, €3 for 60 min.<br>⏱️ Real timetable pulled 10 Nov; recheck platforms on the boards.</div>'+
 '<h3>Food & things to do</h3><div class="card small">Every recommendation comes from Alina\'s Google Maps lists (<a target="_blank" href="'+LIST_LINKS.Brussels+'">Brussels</a>, <a target="_blank" href="'+LIST_LINKS.Ghent+'">Ghent</a>, <a target="_blank" href="'+LIST_LINKS.Bruges+'">Bruges</a>), sorted for each meal by type, whether it\'s open at that time on that day, and distance. New places appear here within about an hour of being added.<br>Photos are from Wikimedia Commons where one exists; otherwise you\'ll see a map of the spot.<br><span id="upd"></span></div>';
DAYS.forEach(d=>S[d.label]=()=>dayHTML(d));
S["📋 All places"]=()=>'<h2>All of Alina\'s places</h2><div class="filters" id="fc"></div><div id="flist" class="grid"></div>';
S["🗺️ Map"]=()=>'<div id="map"></div>';
S["❤️ Saved"]=()=>'<h2>Saved</h2><div id="picks" class="grid"></div>';
const nav=document.getElementById("nav"),main=document.getElementById("main");
Object.keys(S).forEach(k=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>show(k);nav.appendChild(b);const s=document.createElement("section");s.dataset.k=k;main.appendChild(s);});
let cur="Overview",fC="All";
function show(k,keep){cur=k;[...nav.children].forEach(b=>b.classList.toggle("on",b.textContent===k));[...main.children].forEach(s=>{const on=s.dataset.k===k;s.classList.toggle("on",on);if(on)s.innerHTML=S[k]();});
 if(k==="📋 All places")listAll();if(k==="❤️ Saved")saved();if(k==="🗺️ Map")mapInit();if(k==="Overview")upd();markNow();history.replaceState(null,"","#"+encodeURIComponent(k));if(!keep)window.scrollTo(0,0);}
function upd(){const e=document.getElementById("upd");if(e)e.textContent="Last synced: "+new Date(LISTS.updated).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"});}
function listAll(){const fc=document.getElementById("fc");fc.innerHTML=["All","Brussels","Ghent","Bruges"].map(v=>'<button data-v="'+v+'" class="'+(fC===v?"on":"")+'">'+v+'</button>').join("")+'<button id="near">📍 Near me</button>';
 fc.onclick=e=>{if(e.target.dataset.v){fC=e.target.dataset.v;listAll();}};document.getElementById("near").onclick=()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{ME=[p.coords.latitude,p.coords.longitude];listAll();},()=>alert("Couldn't get your location"));};
 let P=fC==="All"?allPlaces():places(fC);const ref=p=>ME||HOTEL[p.city].c;P.sort((a,b)=>hav(ref(a),[a.lat,a.lng])-hav(ref(b),[b.lat,b.lng]));
 document.getElementById("flist").innerHTML=P.map(p=>card(p)).join("");}
function saved(){const P=allPlaces().filter(p=>ticks[p.cid]);document.getElementById("picks").innerHTML=P.length?P.map(p=>card(p)).join(""):'<p class="small">Tap ♡ on any place to save it here.</p>';}
function mapInit(){if(typeof L==="undefined")return;const m=L.map("map");L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors",maxZoom:19}).addTo(m);const pts=[];
 allPlaces().forEach(p=>{const c=[p.lat,p.lng];const mk=L.circleMarker(c,{radius:7,color:"#fff",weight:2,fillColor:ticks[p.cid]?"#d63b74":"#ef7d22",fillOpacity:1}).addTo(m);mk.on("click",()=>openSheet(p.cid));pts.push(c);});
 Object.values(HOTEL).forEach(h=>{L.circleMarker(h.c,{radius:9,color:"#fff",weight:3,fillColor:"#2d6cdf",fillOpacity:1}).addTo(m).bindPopup("🏨 "+h.n);pts.push(h.c);});m.fitBounds(pts,{padding:[25,25]});}
const bxNow=()=>new Date().toLocaleString("sv-SE",{timeZone:"Europe/Brussels"}).replace(" ","T").slice(0,16);
function markNow(){const now=bxNow();const evs=[...main.querySelectorAll(".ev")];let set=false;evs.forEach((e,i)=>{e.classList.remove("now","past");const nx=evs[i+1];if(nx&&nx.dataset.t<=now)e.classList.add("past");else if(!set&&e.dataset.t.slice(0,10)===now.slice(0,10)&&(e.dataset.t<=now||!nx)){e.classList.add("now");set=true;}});}
const today=DAYS.find(d=>d.date===bxNow().slice(0,10));const fab=document.getElementById("fab");
if(today){fab.style.display="block";fab.onclick=()=>{show(today.label);setTimeout(()=>{const n=main.querySelector(".ev.now")||main.querySelector(".ev:not(.past)");if(n)n.scrollIntoView({behavior:"smooth",block:"center"});},50);};}
setInterval(markNow,60000);
const h0=decodeURIComponent(location.hash.slice(1));show(S[h0]?h0:(today?today.label:"Overview"));
fetch(LIST_URL+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.lists&&new Date(j.updated)>=new Date(LISTS.updated)){LISTS=j;show(cur,true);}}).catch(()=>{});
</script></body></html>
