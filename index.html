S["🍴 All food"]=()=>'<h2>All food & drink</h2><div class="small">Filter by type or city. Tick the places you want to go — ticks are saved on this device.</div><div class="filters" id="ft"></div><div class="filters" id="fc"></div><div id="flist"></div>';
S["✅ My picks"]=()=>'<h2>Your ticked list</h2><div id="picks"></div><button onclick="if(confirm(\'Clear all ticks?\')){localStorage.removeItem(KEY);location.reload()}" style="margin-top:12px;background:#3a1d14;color:#fff;border:1px solid #6b3a26;border-radius:8px;padding:8px 12px">Clear ticks</button>';

const nav=document.getElementById("nav"),main=document.getElementById("main");
Object.keys(S).forEach((k,i)=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>show(k);nav.appendChild(b);const s=document.createElement("section");s.id="sec-"+i;s.dataset.k=k;main.appendChild(s);});
function show(k){[...nav.children].forEach(b=>b.classList.toggle("on",b.textContent===k));[...main.children].forEach(s=>{s.classList.toggle("on",s.dataset.k===k);if(s.dataset.k===k){s.innerHTML=S[k]();}});if(k==="🍴 All food")food();if(k==="✅ My picks")picks();bind();scrollTo(0,0);location.hash=encodeURIComponent(k);}
let fT="all",fC="all";
function food(){const ft=document.getElementById("ft"),fc=document.getElementById("fc");
ft.innerHTML=[["all","All"],["street","🍟 Street food"],["rest","🍽️ Restaurants"],["sweet","🍫 Sweet"],["drink","🍺 Drinks"]].map(([v,l])=>'<button data-v="'+v+'" class="'+(fT===v?"on":"")+'">'+l+'</button>').join("");
fc.innerHTML=["all","Brussels","Ghent","Bruges"].map(v=>'<button data-v="'+v+'" class="'+(fC===v?"on":"")+'">'+(v==="all"?"All cities":v)+'</button>').join("");
ft.onclick=e=>{if(e.target.dataset.v){fT=e.target.dataset.v;food();}};fc.onclick=e=>{if(e.target.dataset.v){fC=e.target.dataset.v;food();}};
const L=FOOD.filter(f=>(fT==="all"||f[2]===fT)&&(fC==="all"||f[1]===fC));
let out="",last="";L.forEach(f=>{if(f[1]!==last){out+="<h3>"+f[1]+"</h3>";last=f[1];}out+=item(f[0],f[3],f[4],{q:f[5],tags:T[f[2]]});});
document.getElementById("flist").innerHTML=out||'<div class="m">Nothing matches.</div>';bind();}
function picks(){const all=[...main.querySelectorAll("section")];let tmp=document.createElement("div");tmp.innerHTML=Object.keys(S).filter(k=>!k.startsWith("✅")&&!k.startsWith("🍴")).map(k=>S[k]()).join("")+FOOD.map(f=>item(f[0],f[3],f[4],{q:f[5],tags:T[f[2]]})).join("");
const seen=new Set();const cards=[...tmp.querySelectorAll(".item")].filter(c=>{const id=c.querySelector("input").dataset.id;if(!ticks[id]||seen.has(id))return false;seen.add(id);return true;});
document.getElementById("picks").innerHTML=cards.length?cards.map(c=>c.outerHTML).join(""):'<div class="m">Nothing ticked yet — tick things on the day tabs or under All food.</div>';bind();}
function bind(){main.querySelectorAll('input[type=checkbox]').forEach(cb=>{cb.checked=!!ticks[cb.dataset.id];cb.onchange=()=>{ticks[cb.dataset.id]=cb.checked;if(!cb.checked)delete ticks[cb.dataset.id];localStorage.setItem(KEY,JSON.stringify(ticks));};});}
const h=decodeURIComponent(location.hash.slice(1));show(S[h]?h:"Overview");
</script></body></html>
